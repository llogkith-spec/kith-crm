<!--
  KITH Cars Group — Lead Generation Portal (owner only)
  Drop into llogkith-spec/kith-crm as leadgen.html → llogkith-spec.github.io/kith-crm/leadgen.html

  SETUP
  1. Paste the Supabase anon key into CFG.SUPABASE_KEY below (same key as portal-core.js).
  2. Run this once in Supabase → SQL editor:

     create table if not exists kith_leadgen (
       id text primary key,
       kind text not null,            -- 'metric' | 'post' | 'settings'
       data jsonb not null default '{}',
       updated_at timestamptz default now()
     );
     alter table kith_leadgen enable row level security;
     create policy "anon rw" on kith_leadgen for all using (true) with check (true);

  3. Lead source: the CRM intake form needs a "How did you hear about us?" field.
     normalise() below reads data.source / leadSource / howHeard / heardAbout / channel.
     Edit normalise() once if your field is called something else.

  Until the key is set, the page runs on demo data so you can see how it works.
  The APIs (Google, Meta, TikTok…) aren't wired yet — every channel takes weekly numbers
  by hand for now; see the Connections tab for what each API needs.
-->

<script>

const LEVEL = new Set(['followers','total','rating','avg_position']); // point-in-time, not summed

/* Lead sources as the CRM records them */
const SRC = [
  {k:'google_ads',name:'Google Ads',paid:'google_ads',c:'#5aa9ff'},
  {k:'meta_ads',name:'Meta Ads (FB/IG)',paid:'meta_ads',c:'#b58cff'},
  {k:'gbp',name:'Google Maps / Profile',c:'#3ecf8e'},
  {k:'website',name:'Website (SEO)',c:'#d4af37'},
  {k:'instagram',name:'Instagram',c:'#ff7ab6'},
  {k:'facebook',name:'Facebook',c:'#6f8cff'},
  {k:'tiktok',name:'TikTok',c:'#4ee6e6'},
  {k:'reddit',name:'Reddit',c:'#ff8a4c'},
  {k:'referral',name:'Referral / loyalty',c:'#f1d27a'},
  {k:'repeat',name:'Repeat customer',c:'#9ad07a'},
  {k:'b2b',name:'B2B outreach',c:'#c0c0c8'},
  {k:'walkin',name:'Walk-in / signage',c:'#a88'},
  {k:'unknown',name:'Not recorded',c:'#555'}
];
function mapSource(s){
  s=(s||'').toLowerCase();
  if(!s) return 'unknown';
  if(/google ?ad|adwords|ppc|sponsored/.test(s)) return 'google_ads';
  if(/meta ad|facebook ad|fb ad|insta(gram)? ad|ig ad/.test(s)) return 'meta_ads';
  if(/map|gbp|business profile|google review|google listing/.test(s)) return 'gbp';
  if(/web|site|seo|google|search|online/.test(s)) return 'website';
  if(/insta|\big\b/.test(s)) return 'instagram';
  if(/face|\bfb\b/.test(s)) return 'facebook';
  if(/tik/.test(s)) return 'tiktok';
  if(/reddit/.test(s)) return 'reddit';
  if(/refer|friend|family|loyal|word of mouth/.test(s)) return 'referral';
  if(/repeat|returning|existing|previous/.test(s)) return 'repeat';
  if(/b2b|fleet|email|outreach|trade/.test(s)) return 'b2b';
  if(/walk|passing|sign|board|drove past/.test(s)) return 'walkin';
  return 'unknown';
}

/* CRM pipeline — booked = stage 7 onward */
const BOOKED_STAGES = /book|po|so|raise|complete|done|account|review|referral|follow/i;
const REVIEW_STAGES = /review|referral|follow/i;

/* Map one CRM jobs row → what this page needs. EDIT HERE if field names differ. */
function normalise(row){
  const d = row.data || row;
  const stage = String(d.stage ?? d.status ?? d.column ?? '');
  const lost = /lost/i.test(stage);
  const value = +(d.quote?.total ?? d.total ?? d.finalTotal ?? d.estimateTotal ?? d.invoiceTotal ?? 0) || 0;
  return {
    id: row.id,
    created: new Date(d.createdAt || d.created || row.created_at || Date.now()),
    source: mapSource(d.source || d.leadSource || d.howHeard || d.heardAbout || d.channel),
    division: /body|paint|accident/i.test(d.jobType||d.type||'') ? 'body' : 'mech',
    stage, lost,
    booked: !lost && BOOKED_STAGES.test(stage),
    reviewed: REVIEW_STAGES.test(stage),
    value
  };
}

const PILLARS = ['Service videos — Oil','Service videos — Service','Service videos — MOT','Service videos — Brakes','Service videos — Clutch',
  'Garage Chaos','Mechanic Native Language','Local Area Series','Audience-Targeted Hooks','Garage Skits',
  'Parts & components explainer','Car sales (stock)','Bodywork before/after','Reviews & customer stories'];
const PLATFORMS = ['Instagram','TikTok','Facebook','Google Business','Reddit'];
const SCRIPT = 'Location call-out:\nHook:\nSolution:\nAuthority:\nOffer:\nCTA:';
const DEFAULT_KW = ['garage hackbridge','mot wallington','car service sutton','mechanic carshalton','bodyshop croydon','accident repair sutton','brake repair wallington','car body repair near me'];

/* ============================ STATE ============================ */
const S = {
  tab:'overview', range:8, demo:false,
  metrics:{},   // id → {ch,week,m:{}}
  posts:{},     // id → {date,platform,pillar,title,hook,script,status,reach,leads}
  settings:{ keywords:DEFAULT_KW.slice(), ranks:{}, sitemap:{service:{pages:32,indexed:0},location:{pages:17,indexed:0},combo:{pages:493,indexed:0}},
    targets:{leadsWk:21,reviewsWk:7,postsWk:10,adBudgetWk:250} },
  jobs:[]
};

/* ============================ UTIL ============================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ok=v=>v!=null&&isFinite(v);
const F={n:v=>ok(v)?Math.round(v).toLocaleString('en-GB'):'–',gbp:v=>ok(v)?'£'+Math.round(v).toLocaleString('en-GB'):'–',
  pct:v=>ok(v)?(v*100).toFixed(v<.1&&v>0?1:0)+'%':'–',d1:v=>ok(v)?(+v).toFixed(1):'–',x:v=>ok(v)?(+v).toFixed(1)+'×':'–'};
const sum=(a,f)=>a.reduce((t,x)=>t+(+(f==null?x:typeof f==='function'?f(x):x[f])||0),0);
function monday(d){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const wkey=d=>ymd(monday(d));
function weeks(n,offset=0){const m=monday(new Date()),o=[];for(let i=n-1+offset;i>=offset;i--){const d=new Date(m);d.setDate(d.getDate()-7*i);o.push(ymd(d))}return o}
const wlabel=w=>{const d=new Date(w);return d.getDate()+' '+d.toLocaleString('en-GB',{month:'short'})};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
function trend(cur,prev,invert=false,asPct=true){
  if(!ok(cur)||!ok(prev)||prev===0) return '<span class="tr fl">—</span>';
  const ch=(cur-prev)/Math.abs(prev); const good=invert?ch<0:ch>0;
  if(Math.abs(ch)<.02) return '<span class="tr fl">→ flat</span>';
  return `<span class="tr ${good?'up':'dn'}">${ch>0?'▲':'▼'} ${asPct?Math.abs(ch*100).toFixed(0)+'%':Math.abs(cur-prev).toFixed(1)}</span>`;
}
function M(ch,week){return S.metrics[ch+'_'+week]?.m||{}}
function mSum(ch,key,W){return sum(W,w=>M(ch,w)[key])}
function mSeries(ch,key,W){return W.map(w=>{const v=M(ch,w)[key];return v===''||v==null?null:+v})}
function mLatest(ch,key,W){for(let i=W.length-1;i>=0;i--){const v=M(ch,W[i])[key];if(v!==''&&v!=null)return +v}return null}
function mFirst(ch,key,W){for(const w of W){const v=M(ch,w)[key];if(v!==''&&v!=null)return +v}return null}
function mAvg(ch,key,W){const a=mSeries(ch,key,W).filter(ok);return a.length?sum(a)/a.length:null}
const jobsIn=W=>{const s=new Set(W);return S.jobs.filter(j=>s.has(wkey(j.created)))};

  async get(t,q){const r=await fetch(`${CFG.SUPABASE_URL}/rest/v1/${t}?${q}`,{headers:this.h()});if(!r.ok)throw new Error(t+' '+r.status);return r.json()},
  async put(row){const r=await fetch(`${CFG.SUPABASE_URL}/rest/v1/${CFG.TABLE}`,{method:'POST',headers:{...this.h(),Prefer:'resolution=merge-duplicates'},body:JSON.stringify({...row,updated_at:new Date().toISOString()})});if(!r.ok)throw new Error('save '+r.status)},
  async del(id){await fetch(`${CFG.SUPABASE_URL}/rest/v1/${CFG.TABLE}?id=eq.${encodeURIComponent(id)}`,{method:'DELETE',headers:this.h()})}
};
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({metrics:S.metrics,posts:S.posts,settings:S.settings}))}catch(e){}}
async function save(kind,id,data){
  if(kind==='metric') S.metrics[id]=data; else if(kind==='post') S.posts[id]=data; else S.settings=data;
  if(DB.on()&&!S.demo){try{await DB.put({id,kind,data})}catch(e){toast('Save failed — check connection');console.error(e);return}}
  else saveLocal();
  toast('Saved');
}
async function remove(kind,id){
  if(kind==='post') delete S.posts[id]; else delete S.metrics[id];
  if(DB.on()&&!S.demo){try{await DB.del(id)}catch(e){}} else saveLocal();
}
async function load(){
  if(DB.on()){
    try{
      const rows=await DB.get(CFG.TABLE,'select=*');
      rows.forEach(r=>{if(r.kind==='metric')S.metrics[r.id]=r.data;else if(r.kind==='post')S.posts[r.id]=r.data;else if(r.kind==='settings')S.settings={...S.settings,...r.data}});

      return;
    }catch(e){console.error(e);toast('Could not reach Supabase — showing demo')}
  }
  let local=null; try{local=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
  if(local&&Object.keys(local.metrics||{}).length){Object.assign(S,{metrics:local.metrics,posts:local.posts||{},settings:{...S.settings,...local.settings}})}
  else seedDemo();
  if(!S.jobs.length) seedDemoJobs();
  S.demo=true;
}

/* ============================ DEMO DATA ============================ */
let seed=7;const DEMO_WEEKS=26; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647; const ri=(a,b)=>Math.round(a+rnd()*(b-a));
function seedDemo(){
  const W=weeks(DEMO_WEEKS); let f={instagram:1840,facebook:960,tiktok:620}; let gpos=16.5; let rv=40;
  W.forEach((w,i)=>{
    const g=1+i*.02;

/* ============================ CHARTS ============================ */
function line(series,labels,{h=170,inv=false}={}){
  const all=series.flatMap(s=>s.v.filter(ok)); if(!all.length) return '<div class="empty">No numbers yet — hit “+ Log numbers”.</div>';
  const w=640,L=40,R=10,T=10,B=22; let mn=inv?Math.min(...all):Math.min(0,...all),mx=Math.max(...all); if(mx===mn)mx=mn+1;
  const X=i=>L+(labels.length<2?0:i*(w-L-R)/(labels.length-1));
  const Y=v=>{const t=(v-mn)/(mx-mn);return inv?T+t*(h-T-B):h-B-t*(h-T-B)};
  let g=''; for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3,y=Y(v);g+=`<line x1="${L}" x2="${w-R}" y1="${y}" y2="${y}" stroke="#27272d"/><text x="${L-6}" y="${y+3}" text-anchor="end">${v>=1000?(v/1000).toFixed(1)+'k':+v.toFixed(mx-mn<10?1:0)}</text>`}
  const step=Math.ceil(labels.length/8); labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1)g+=`<text x="${X(i)}" y="${h-6}" text-anchor="middle">${l}</text>`});
  const p=series.map(s=>{let d='',pen=false;s.v.forEach((v,i)=>{if(!ok(v)){pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';pen=true});
    return `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`+s.v.map((v,i)=>ok(v)?`<circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="${s.c}"><title>${esc(s.n)} · ${labels[i]}: ${F.n(v)}</title></circle>`:'').join('')}).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none" style="height:${h}px">${g}${p}</svg>`+(series.length>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div>`:'');
}
function bars(vals,labels,{h=150,c='#d4af37',target=null}={}){
  const mx=Math.max(1,target||0,...vals.filter(ok)); const w=640,L=30,B=22,T=8; const bw=(w-L)/vals.length;
  let s=''; vals.forEach((v,i)=>{const bh=ok(v)?(v/mx)*(h-B-T):0;s+=`<rect x="${L+i*bw+bw*.18}" y="${h-B-bh}" width="${bw*.64}" height="${bh}" rx="3" fill="${c}"><title>${labels[i]}: ${F.n(v)}</title></rect>`;
    if(i%Math.ceil(vals.length/8)===0)s+=`<text x="${L+i*bw+bw/2}" y="${h-6}" text-anchor="middle">${labels[i]}</text>`});
  if(target){const y=h-B-(target/mx)*(h-B-T);s+=`<line x1="${L}" x2="${w}" y1="${y}" y2="${y}" stroke="#3ecf8e" stroke-dasharray="4 4"/><text x="${L-4}" y="${y+3}" text-anchor="end" style="fill:#3ecf8e">${target}</text>`}
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none" style="height:${h}px">${s}</svg>`;
}
function spark(vals,inv){const a=vals.filter(ok);if(a.length<2)return'';const w=90,h=24,mn=Math.min(...a),mx=Math.max(...a)||1;const r=mx-mn||1;
  let d='',pen=false;vals.forEach((v,i)=>{if(!ok(v)){pen=false;return}const x=i*w/(vals.length-1),t=(v-mn)/r,y=inv?2+t*(h-4):h-2-t*(h-4);d+=(pen?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';pen=true});
  return `<svg width="${w}" height="${h}"><path d="${d}" fill="none" stroke="#d4af37" stroke-width="1.6"/></svg>`}
const kpi=(label,val,tr='',sub='')=>`<div class="card kpi"><div class="l">${label}</div><div class="v">${val}${tr}</div>${sub?`<div class="l">${sub}</div>`:''}</div>`;

function attribution(W,Wp){
  const J=jobsIn(W),Jp=jobsIn(Wp);
  return SRC.map(s=>{
    const j=J.filter(x=>x.source===s.k),b=j.filter(x=>x.booked),rev=sum(b,'value');
    const spend=s.paid?mSum(s.paid,'spend',W):0;
    const r={...s,leads:j.length,booked:b.length,rev,spend,prevLeads:Jp.filter(x=>x.source===s.k).length,
      conv:j.length?b.length/j.length:null,cpl:s.paid&&j.length?spend/j.length:null,cpb:s.paid&&b.length?spend/b.length:null,roas:s.paid&&spend?rev/spend:null};
    r.verdict=verdict(r); return r;
  }).filter(r=>r.leads||r.spend);
}
function verdict(r){
  if(r.k==='unknown') return r.leads?['Fix intake','t-fix']:['','t-mu'];
  if(r.leads<4&&!r.spend) return ['Too early','t-mu'];
  if(r.paid){ if(r.spend>100&&!r.booked) return ['Cut','t-cut']; if(r.roas>=4) return ['Scale','t-scale']; if(r.roas>=2) return ['Keep','t-keep']; return ['Fix','t-fix'] }
  return r.conv>=.45?['Strong','t-scale']:r.conv>=.25?['Keep','t-keep']:['Nurture','t-fix'];
}
function insights(W,Wp,A){
  const out=[],T=S.settings.targets,add=(c,t,s)=>out.push({c,t,s});
  const leads=sum(A,'leads'); const unk=A.find(a=>a.k==='unknown');
  if(unk&&leads&&unk.leads/leads>.08) add('#f5a524',`${F.pct(unk.leads/leads)} of leads have no source recorded`,'Every lead without a source is a blind spot. Make “How did you hear about us?” a required field on the CRM intake form.');
  const paid=A.filter(a=>a.paid&&a.spend>0).sort((a,b)=>(b.roas||0)-(a.roas||0));
  if(paid[0]&&paid[0].roas) add('#3ecf8e',`${paid[0].name} is returning ${F.x(paid[0].roas)} on spend`,`${F.gbp(paid[0].spend)} spent → ${paid[0].booked} bookings worth ${F.gbp(paid[0].rev)} (${F.gbp(paid[0].cpb)} per booking).`);
  paid.slice(1).forEach(p=>{if(p.roas!=null&&paid[0].roas&&p.roas<paid[0].roas/2) add('#ff5d5d',p.booked?`${p.name} costs ${F.gbp(p.cpb)} per booking`:`${p.name}: ${F.gbp(p.spend)} spent, no bookings yet`,`Less than half the return of ${paid[0].name}. Test new creative/offer or move budget across.`)});
  const free=A.filter(a=>!a.paid&&a.k!=='unknown'&&a.leads>=4).sort((a,b)=>b.rev-a.rev);
  if(free[0]) add('#3ecf8e',`Best free channel: ${free[0].name}`,`${free[0].leads} leads, ${F.pct(free[0].conv)} booked, ${F.gbp(free[0].rev)} revenue — for £0 ad spend.`);
  A.forEach(a=>{if(a.prevLeads>=5){const ch=(a.leads-a.prevLeads)/a.prevLeads;if(ch<=-.3)add('#ff5d5d',`${a.name} leads down ${Math.round(-ch*100)}%`,`${a.leads} this period vs ${a.prevLeads} the period before.`);else if(ch>=.4)add('#3ecf8e',`${a.name} leads up ${Math.round(ch*100)}%`,`${a.leads} vs ${a.prevLeads}. Find out what changed and do more of it.`)}});
  const wkLeads=leads/W.length; if(wkLeads<T.leadsWk) add('#f5a524',`Averaging ${F.d1(wkLeads)} leads a week (target ${T.leadsWk})`,'Short by '+F.d1(T.leadsWk-wkLeads)+' a week.');
  const rvW=mSum('rv_google','new_reviews',W)/W.length; if(rvW<T.reviewsWk) add('#f5a524',`Google reviews: ${F.d1(rvW)}/week vs target ${T.reviewsWk}`,'Stage 11 (Review/Referral) is where these come from — check every completed job gets the review ask.');
  const pos=mLatest('gsc','avg_position',W),pos0=mFirst('gsc','avg_position',W); if(ok(pos)&&ok(pos0)&&Math.abs(pos-pos0)>=.5) add(pos<pos0?'#3ecf8e':'#ff5d5d',`Average Google position ${pos<pos0?'improved':'slipped'} ${F.d1(pos0)} → ${F.d1(pos)}`,'Across all queries in Search Console.');
  const sm=S.settings.sitemap.combo; if(sm.pages&&sm.indexed/sm.pages<.6) add('#f5a524',`Only ${F.pct(sm.indexed/sm.pages)} of service-area pages indexed`,`${sm.indexed} of ${sm.pages}. Unique rewrites + internal links should lift this; resubmit the sitemap after each batch.`);
  const posts=Object.values(S.posts).filter(p=>p.status==='posted'&&W.includes(wkey(p.date))).length/W.length;
  if(posts<T.postsWk) add('#f5a524',`Posting ${F.d1(posts)}×/week vs target ${T.postsWk}`,'See the Content tab for what’s scripted and ready to film.');
  const bestP=pillarStats(W)[0]; if(bestP&&bestP.leads) add('#d4af37',`Top content pillar: ${bestP.p}`,`${bestP.leads} leads from ${bestP.n} posts. Make more of these.`);
  const spend=mSum('google_ads','spend',W.slice(-1))+mSum('meta_ads','spend',W.slice(-1)); if(spend>T.adBudgetWk*1.1) add('#ff5d5d',`Ad spend this week ${F.gbp(spend)} — over the ${F.gbp(T.adBudgetWk)} budget`,'');
  return out;
}
function pillarStats(W){
  const P={}; Object.values(S.posts).filter(p=>p.status==='posted'&&(!W||W.includes(wkey(p.date)))).forEach(p=>{const o=P[p.pillar]||(P[p.pillar]={p:p.pillar,n:0,reach:0,leads:0});o.n++;o.reach+=+p.reach||0;o.leads+=+p.leads||0});
  return Object.values(P).sort((a,b)=>b.leads-a.leads||b.reach-a.reach);
}

    ${[['service','Service pages'],['location','Location pages'],['combo','Service-area pages']].map(([k,l])=>`<div style="margin:10px 0"><div class="row" style="justify-content:space-between"><span>${l}</span><span>${F.n(sm[k].indexed)} / ${F.n(sm[k].pages)} · ${F.pct(sm[k].pages?sm[k].indexed/sm[k].pages:null)}</span></div><div class="bar"><i style="width:${sm[k].pages?sm[k].indexed/sm[k].pages*100:0}%"></i></div></div>`).join('')}
    <p class="mu" style="font-size:12px;margin:8px 0 0">From Search Console → Indexing → Pages, filtered by sitemap.</p></div>`;
}

function vSocial(W,Wp){
  const plats=['instagram','facebook','tiktok','reddit'];
  const J=jobsIn(W),Jp=jobsIn(Wp);
  const cards=plats.map(p=>{
    const f=mLatest(p,'followers',W),f0=mFirst(p,'followers',W),reach=mSum(p,'reach',W)||mSum(p,'views',W),eng=mSum(p,'engagement',W)||mSum(p,'upvotes',W);
    const leads=J.filter(j=>j.source===p).length,booked=J.filter(j=>j.source===p&&j.booked).length,posts=mSum(p,'posts',W);
    return `<div class="card"><h3>${CH[p].name}<span class="sp"></span><button class="btn-s" onclick="openLog('${p}')">Log</button></h3>
      <div class="grid k2" style="gap:8px">
        <div><div class="mu" style="font-size:12px">Followers</div><b style="font-size:20px">${F.n(f)}</b> ${ok(f)&&ok(f0)?`<span class="up tr">+${F.n(f-f0)}</span>`:''}</div>
        <div><div class="mu" style="font-size:12px">${p==='tiktok'?'Views':p==='reddit'?'Upvotes':'Reach'}</div><b style="font-size:20px">${F.n(p==='reddit'?eng:reach)}</b></div>
        <div><div class="mu" style="font-size:12px">Engagement rate</div><b>${p==='reddit'?'–':F.pct(reach?eng/reach:null)}</b></div>
        <div><div class="mu" style="font-size:12px">Posts</div><b>${F.n(posts)}</b> <span class="mu">(${F.d1(posts/W.length)}/wk)</span></div>
        <div><div class="mu" style="font-size:12px">Leads in CRM</div><b>${leads}</b> ${trend(leads,Jp.filter(j=>j.source===p).length)}</div>
        <div><div class="mu" style="font-size:12px">Booked</div><b>${booked}</b> <span class="mu">${F.gbp(sum(J.filter(j=>j.source===p&&j.booked),'value'))}</span></div>
      </div></div>`}).join('');
  return `<div class="grid k2">${cards}</div>
  <div class="grid k2" style="margin-top:12px">
    <div class="card"><h3>Reach / views per week</h3>${line([{n:'Instagram',c:'#ff7ab6',v:mSeries('instagram','reach',W)},{n:'Facebook',c:'#6f8cff',v:mSeries('facebook','reach',W)},{n:'TikTok views',c:'#4ee6e6',v:mSeries('tiktok','views',W)}],W.map(wlabel))}</div>
    <div class="card"><h3>Follower growth</h3>${line([{n:'Instagram',c:'#ff7ab6',v:mSeries('instagram','followers',W)},{n:'Facebook',c:'#6f8cff',v:mSeries('facebook','followers',W)},{n:'TikTok',c:'#4ee6e6',v:mSeries('tiktok','followers',W)}],W.map(wlabel))}</div>
  </div>
  <div class="card" style="margin-top:12px"><h3>Social → real enquiries</h3>
    <p class="mu" style="margin:0">Reach is vanity until it turns into a lead. Enquiry DMs logged: <b style="color:var(--tx)">${F.n(mSum('instagram','dms',W)+mSum('facebook','messages',W)+mSum('tiktok','dms',W)+mSum('reddit','dms',W))}</b> · leads the CRM attributes to social: <b style="color:var(--tx)">${J.filter(j=>plats.includes(j.source)).length}</b>. If DMs are much higher than CRM leads, social enquiries aren't making it into intake.</p></div>`;
}

function vReviews(W,Wp){
  const R=['rv_google','rv_fixmycar','rv_facebook','rv_trustpilot'],T=S.settings.targets;
  const newR=sum(R,r=>mSum(r,'new_reviews',W)),newRp=sum(R,r=>mSum(r,'new_reviews',Wp));
  const g=mSeries('rv_google','new_reviews',W);
  const done=jobsIn(W).filter(j=>j.reviewed).length, gNew=mSum('rv_google','new_reviews',W);
  return `<div class="grid k4">
    ${kpi('New reviews (all)',F.n(newR),trend(newR,newRp),F.d1(newR/(W.length*7))+' per day')}
    ${kpi('Google rating',F.d1(mLatest('rv_google','rating',W)),'',F.n(mLatest('rv_google','total',W))+' reviews total')}
    ${kpi('Google reviews / week',F.d1(gNew/W.length),'','target '+T.reviewsWk)}
    ${kpi('Review ask hit rate',F.pct(done?gNew/done:null),'',`${gNew} reviews from ${done} jobs at stage 11`)}
  </div>
  <div class="card" style="margin-top:12px"><h3>Google reviews per week</h3>${bars(g,W.map(wlabel),{target:T.reviewsWk})}</div>
  <div class="card tw" style="margin-top:12px"><h3>By platform<span class="sp"></span><button class="btn-s" onclick="openLog('rv_google')">Log reviews</button></h3>
    <table><tr><th>Platform</th><th>New (period)</th><th>Per day</th><th>vs prev</th><th>Total</th><th>Rating</th></tr>
    ${R.map(r=>{const n=mSum(r,'new_reviews',W);return `<tr><td>${CH[r].name}</td><td>${F.n(n)}</td><td>${F.d1(n/(W.length*7))}</td><td>${trend(n,mSum(r,'new_reviews',Wp))}</td><td>${F.n(mLatest(r,'total',W))}</td><td>${ok(mLatest(r,'rating',W))?'★ '+F.d1(mLatest(r,'rating',W)):'–'}</td></tr>`}).join('')}
    </table></div>`;
}

function vAds(W,Wp){
  const T=S.settings.targets,J=jobsIn(W);
  const P=[['google_ads','Google Ads','#5aa9ff'],['meta_ads','Meta Ads','#b58cff']].map(([k,n,c])=>{
    const spend=mSum(k,'spend',W),clicks=mSum(k,'clicks',W),imp=mSum(k,'impressions',W),conv=mSum(k,'conversions',W);
    const j=J.filter(x=>x.source===k),b=j.filter(x=>x.booked),rev=sum(b,'value');
    return {k,n,c,spend,clicks,imp,conv,leads:j.length,booked:b.length,rev,prev:mSum(k,'spend',Wp)};
  });
  const thisWk=weeks(1),wkSpend=sum(P,p=>mSum(p.k,'spend',thisWk));
  const rows=[['Spend',p=>F.gbp(p.spend)],['Impressions',p=>F.n(p.imp)],['Clicks',p=>F.n(p.clicks)],['CTR',p=>F.pct(p.imp?p.clicks/p.imp:null)],['Cost per click',p=>p.clicks?'£'+(p.spend/p.clicks).toFixed(2):'–'],
    ['Conversions (platform)',p=>F.n(p.conv)],['Leads in CRM',p=>F.n(p.leads)],['Booked (CRM)',p=>F.n(p.booked)],['Cost per lead',p=>F.gbp(p.leads?p.spend/p.leads:null)],['Cost per booking',p=>F.gbp(p.booked?p.spend/p.booked:null)],['Revenue',p=>F.gbp(p.rev)],['ROAS',p=>F.x(p.spend?p.rev/p.spend:null)]];
  return `<div class="grid k3">
    ${kpi('Total spend',F.gbp(sum(P,'spend')),trend(sum(P,'spend'),sum(P,'prev'),true))}
    ${kpi('Bookings from ads',F.n(sum(P,'booked')),'',F.gbp(sum(P,'booked')?sum(P,'spend')/sum(P,'booked'):null)+' each')}
    ${kpi('This week vs budget',F.gbp(wkSpend),'',`of ${F.gbp(T.adBudgetWk)} · <span class="${wkSpend>T.adBudgetWk?'dn':'up'}">${F.pct(wkSpend/T.adBudgetWk)}</span>`)}
  </div>
  <div class="card tw" style="margin-top:12px"><h3>Platform vs reality<span class="sp"></span><button class="btn-s" onclick="openLog('google_ads')">Log Google Ads</button><button class="btn-s" onclick="openLog('meta_ads')">Log Meta Ads</button></h3>
    <table><tr><th></th>${P.map(p=>`<th style="color:${p.c}">${p.n}</th>`).join('')}</tr>${rows.map(([l,f])=>`<tr><td>${l}</td>${P.map(p=>`<td>${f(p)}</td>`).join('')}</tr>`).join('')}</table>
    <p class="mu" style="font-size:12px;margin:8px 0 0">“Conversions (platform)” is what Google/Meta claim. “Leads/Booked in CRM” is what actually landed. A big gap means tracking is double-counting, or leads aren't being tagged with their source at intake.</p></div>
  <div class="grid k2" style="margin-top:12px">
    <div class="card"><h3>Weekly spend</h3>${line(P.map(p=>({n:p.n,c:p.c,v:mSeries(p.k,'spend',W)})),W.map(wlabel))}</div>
    <div class="card"><h3>Bookings from ads per week</h3>${line(P.map(p=>({n:p.n,c:p.c,v:W.map(w=>S.jobs.filter(j=>j.source===p.k&&j.booked&&wkey(j.created)===w).length)})),W.map(wlabel))}</div>
  </div>`;
}

let weekOff=0;
function vContent(W){
  const m=monday(new Date());m.setDate(m.getDate()+weekOff*7);
  const days=[...Array(7)].map((_,i)=>{const d=new Date(m);d.setDate(d.getDate()+i);return d});
  const posts=Object.entries(S.posts);
  const wk=posts.filter(([,p])=>wkey(p.date)===ymd(m));
  const cnt=s=>wk.filter(([,p])=>p.status===s).length;
  const PS=pillarStats(W);
  return `<div class="grid k4">
    ${kpi('Planned this week',wk.length,'','target '+S.settings.targets.postsWk)}
    ${kpi('Scripted / filmed',cnt('scripted')+' / '+cnt('filmed'))}
    ${kpi('Posted',cnt('posted'))}
    ${kpi('Leads from posts',F.n(sum(PS,'leads')),'','last '+S.range+' weeks')}
  </div>
  <div class="card" style="margin-top:12px"><h3>Week of ${wlabel(ymd(m))}<span class="sp"></span>
    <button class="btn-s" onclick="weekOff--;render()">‹</button><button class="btn-s" onclick="weekOff=0;render()">This week</button><button class="btn-s" onclick="weekOff++;render()">›</button></h3>
    <div class="week">${days.map(d=>{const k=ymd(d);return `<div class="day"><h4>${d.toLocaleString('en-GB',{weekday:'short'})} ${d.getDate()}<span class="sp"></span><a href="#" onclick="openPost(null,'${k}');return false">+ add</a></h4>
      ${wk.filter(([,p])=>p.date===k).map(([id,p])=>`<div class="post st-${p.status}" onclick="openPost('${id}')"><b>${esc(p.title||p.pillar)}</b><div class="p">${esc(p.platform)} · ${esc(p.status)}${p.status==='posted'&&(p.reach||p.leads)?` · ${F.n(p.reach)} reach · ${p.leads||0} leads`:''}</div></div>`).join('')}</div>`}).join('')}</div>
    <div class="legend"><span><i style="background:#555"></i>Idea</span><span><i style="background:var(--bl)"></i>Scripted</span><span><i style="background:var(--am)"></i>Filmed</span><span><i style="background:var(--gr)"></i>Posted</span></div></div>
  <div class="sec">Which content pillars bring customers</div>
  <div class="card tw"><table><tr><th>Pillar</th><th>Posts</th><th>Reach</th><th>Reach/post</th><th>Leads</th><th>Leads/post</th></tr>
    ${PS.map(p=>`<tr><td>${esc(p.p)}</td><td>${p.n}</td><td>${F.n(p.reach)}</td><td>${F.n(p.reach/p.n)}</td><td><b>${p.leads}</b></td><td>${F.d1(p.leads/p.n)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Mark posts as posted and add their reach/leads to see this.</td></tr>'}
  </table><p class="mu" style="font-size:12px;margin:8px 0 0">After a post has been up a few days, open it and add reach + how many enquiries mentioned it. That's what teaches this table what works.</p></div>`;
}

  const grp={seo:'SEO & Google',social:'Social',ads:'Paid ads',reviews:'Reviews'};
  return `<div class="card"><h3>Data source</h3>
    <p style="margin:0">CRM (leads, bookings, revenue): <b class="${DB.on()&&!S.demo?'up':'dn'}">${DB.on()&&!S.demo?'Live — Supabase':'Demo data'}</b> · ${S.jobs.length} jobs loaded</p>
    <p class="mu" style="font-size:12px">Needs <code>CFG.SUPABASE_KEY</code> and the <code>kith_leadgen</code> table (SQL is in the comment at the top of this file). Lead source is read by <code>normalise()</code>.</p></div>
  <div class="card" style="margin-top:12px"><h3>Suggested order to connect the APIs</h3>
    <ol style="margin:0;padding-left:18px;line-height:1.8">
      <li><b>Search Console + GA4</b> — free, one Google Cloud project covers both, no approval wait.</li>
      <li><b>Google Ads</b> — apply for the developer token now; your biggest spend line.</li>
      <li><b>Business Profile</b> — apply for API access early, it's the slowest approval (also unlocks Google reviews).</li>
      <li><b>Meta (Instagram + Facebook + Meta Ads)</b> — one Meta developer app covers all three.</li>
      <li><b>TikTok, Reddit, Trustpilot, FixMyCar</b> — keep manual; low value per hour of setup.</li>
    </ol>
    <p class="mu" style="font-size:12px;margin-bottom:0">API keys can't live in this page (the repo is public) — each connector will run through a small proxy (Supabase Edge Function or Apps Script, like the CRM's Gemini proxy) that writes weekly numbers into <code>kith_leadgen</code>. This page then shows them automatically; nothing here changes.</p></div>
  <div class="card tw" style="margin-top:12px"><h3>Channels<span class="sp"></span><button class="btn-s" onclick="openTargets()">Targets</button></h3><table><tr><th>Channel</th><th>Area</th><th>Status</th><th style="text-align:left">What the API needs</th></tr>
    ${Object.entries(CH).map(([k,c])=>`<tr><td>${c.name}</td><td>${grp[c.grp]}</td><td><span class="tag t-fix">Manual entry</span></td><td style="text-align:left;white-space:normal;color:var(--mu);font-size:12px">${esc(c.api)}</td></tr>`).join('')}
  </table></div>`;
}

/* ============================ DIALOGS ============================ */
function dlg(title,body,onSave,extra=''){
  $('#dlgForm').innerHTML=`<div class="dh">${title}<span class="sp"></span><button value="x" style="border:0;background:none">✕</button></div><div class="db">${body}</div><div class="df">${extra}<span class="sp"></span><button value="x">Cancel</button><button class="btn-g" value="ok" id="dOk">Save</button></div>`;
  const d=$('#dlg'); d.returnValue=''; d.showModal();
  $('#dOk').onclick=async e=>{e.preventDefault();await onSave(new FormData($('#dlgForm')));d.close();render()};
}
function openLog(ch){
  ch=ch||({seo:'gsc',social:'instagram',reviews:'rv_google',ads:'google_ads'}[S.tab]||'gsc');
  const W=weeks(12).reverse(),w=W[0];
  const body=`<div class="two"><label>Channel<select name="ch" onchange="openLog(this.value)">${Object.entries(CH).map(([k,c])=>`<option value="${k}" ${k===ch?'selected':''}>${c.name}</option>`).join('')}</select></label>
    <label>Week commencing<select name="week" id="wkSel">${W.map((x,i)=>`<option value="${x}">${wlabel(x)}${i===0?' (this week)':''}</option>`).join('')}</select></label></div>
    <div id="mFields" class="two"></div><p class="mu" style="font-size:12px;margin:0">Weekly totals (followers/total/rating = the figure at the end of the week).</p>`;
  dlg('Log numbers',body,async fd=>{const wk=fd.get('week'),m={};Object.keys(CH[ch].m).forEach(k=>{const v=fd.get(k);if(v!=='')m[k]=+v});await save('metric',ch+'_'+wk,{ch,week:wk,m})});
  const fill=()=>{const cur=M(ch,$('#wkSel').value);$('#mFields').innerHTML=Object.entries(CH[ch].m).map(([k,l])=>`<label>${l}<input type="number" step="any" name="${k}" value="${cur[k]??''}"></label>`).join('')};
  $('#wkSel').onchange=fill; fill();
}
function openRanks(){
  const w=weeks(1)[0],cur=S.settings.ranks[w]||{};
  dlg('Keyword positions — w/c '+wlabel(w),S.settings.keywords.map((k,i)=>`<label>${esc(k)}<input type="number" name="k${i}" value="${cur[k]??''}"></label>`).join('')+
    `<label>Or paste from Search Console (query, position per line)<textarea name="paste" placeholder="garage hackbridge, 4.2"></textarea></label>`,
    async fd=>{const r={};S.settings.keywords.forEach((k,i)=>{const v=fd.get('k'+i);if(v!=='')r[k]=+v});
      (fd.get('paste')||'').split('\n').forEach(l=>{const m=l.split(/[,\t]/);if(m.length>=2){const q=m[0].trim().toLowerCase(),p=parseFloat(m[m.length-1]);if(S.settings.keywords.includes(q)&&ok(p))r[q]=Math.round(p)}});
      S.settings.ranks[w]=r;await save('settings','settings',S.settings)});
}
function openKw(){dlg('Tracked keywords',`<label>One per line<textarea name="kw" style="min-height:200px">${esc(S.settings.keywords.join('\n'))}</textarea></label>`,async fd=>{S.settings.keywords=fd.get('kw').split('\n').map(s=>s.trim().toLowerCase()).filter(Boolean);await save('settings','settings',S.settings)})}
function openSitemap(){const sm=S.settings.sitemap;dlg('Sitemap indexing',[['service','Service pages'],['location','Location pages'],['combo','Service-area pages']].map(([k,l])=>`<div class="two"><label>${l} — total<input type="number" name="${k}_p" value="${sm[k].pages}"></label><label>Indexed<input type="number" name="${k}_i" value="${sm[k].indexed}"></label></div>`).join(''),
  async fd=>{['service','location','combo'].forEach(k=>sm[k]={pages:+fd.get(k+'_p'),indexed:+fd.get(k+'_i')});await save('settings','settings',S.settings)})}
function openTargets(){const t=S.settings.targets;dlg('Targets',`<div class="two"><label>Leads per week<input type="number" name="leadsWk" value="${t.leadsWk}"></label><label>Google reviews per week<input type="number" name="reviewsWk" value="${t.reviewsWk}"></label><label>Posts per week<input type="number" name="postsWk" value="${t.postsWk}"></label><label>Weekly ad budget (£)<input type="number" name="adBudgetWk" value="${t.adBudgetWk}"></label></div>`,
  async fd=>{Object.keys(t).forEach(k=>t[k]=+fd.get(k));await save('settings','settings',S.settings)})}
function openPost(id,date){
  const p=id?S.posts[id]:{date,platform:'Instagram',pillar:PILLARS[0],title:'',hook:'',script:SCRIPT,status:'idea',reach:'',leads:''};
  const body=`<div class="two"><label>Date<input type="date" name="date" value="${p.date}"></label><label>Platform<select name="platform">${PLATFORMS.map(x=>`<option ${x===p.platform?'selected':''}>${x}</option>`).join('')}</select></label></div>
   <label>Pillar<select name="pillar">${[...new Set([...PILLARS,p.pillar])].map(x=>`<option ${x===p.pillar?'selected':''}>${esc(x)}</option>`).join('')}</select></label>
   <label>Title / hook<input name="title" value="${esc(p.title)}"></label>
   <label>Script (6-point framework)<textarea name="script" style="min-height:150px">${esc(p.script||SCRIPT)}</textarea></label>
   <div class="two"><label>Status<select name="status">${['idea','scripted','filmed','posted'].map(x=>`<option ${x===p.status?'selected':''}>${x}</option>`).join('')}</select></label><label>&nbsp;<span></span></label>
   <label>Reach / views (after posting)<input type="number" name="reach" value="${p.reach??''}"></label><label>Enquiries from it<input type="number" name="leads" value="${p.leads??''}"></label></div>`;
  dlg(id?'Edit post':'Plan a post',body,async fd=>{const d=Object.fromEntries(fd.entries());d.reach=+d.reach||0;d.leads=+d.leads||0;await save('post',id||'post_'+Date.now(),d)},
    id?`<button class="btn-s" style="color:var(--rd)" onclick="event.preventDefault();remove('post','${id}').then(()=>{$('#dlg').close();render()})">Delete</button>`:'');
}
function clearDemo(){if(!confirm('Clear all demo numbers and start with an empty portal?'))return;S.metrics={};S.posts={};S.settings.ranks={};S.settings.sitemap={service:{pages:32,indexed:0},location:{pages:17,indexed:0},combo:{pages:493,indexed:0}};if(!DB.on())S.jobs=[];saveLocal();render()}

/* ============================ OWNER GATE ============================ */
async function checkPin(){
  const pin=$('#pin').value.trim(); let okk=false;
  if(DB.on()){try{const r=await DB.get(CFG.STAFF_TABLE,`select=name,role&pin=eq.${encodeURIComponent(pin)}&active=eq.true`);okk=r.some(x=>/director|owner|admin|manager/i.test(x.role||''))}catch(e){}}
  if(!okk&&CFG.OWNER_PIN) okk=pin===CFG.OWNER_PIN;
  if(okk){try{sessionStorage.setItem('kith_lg_ok','1')}catch(e){}$('#gate').style.display='none';boot()}else $('#pinErr').textContent='Not an owner PIN';
}
$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')checkPin()});
async function boot(){await load();render()}
(function(){
  let pass=false;try{pass=sessionStorage.getItem('kith_lg_ok')==='1'}catch(e){}
  if(!DB.on()&&!CFG.OWNER_PIN) pass=true;       // demo mode: no lock
  if(pass) boot(); else {$('#gate').style.display='flex';$('#pin').focus()}
})();
</script>
